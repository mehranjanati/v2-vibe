services:
  redis:
    # redis-stack bundles the RediSearch module needed by the vector index.
    # If you don't need vector search, switch to plain `redis:7-alpine` and
    # remove the module flag from the command below.
    image: redis/redis-stack-server:7.2.0-v17
    container_name: vibesdk-redis
    # protected-mode no is required: the backend connects over the internal
    # (private) compose network, not loopback — protected mode would DENY it.
    command: ["redis-server", "--loadmodule", "/opt/redis-stack/lib/redisearch.so", "--protected-mode", "no"]
    # Host port 6380 maps to container 6379 to avoid clashing with the
    # system redis-server / other Docker containers already on host:6379.
    # The backend connects over the internal compose network as `redis:6379`.
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vibesdk-backend
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis:6379
      PORT: 8080
      # Pull non-secret config from repo .env if present; secrets stay in .env
      AI_GATEWAY_URL: ${AI_GATEWAY_URL:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-@cf/qwen/qwen2.5-coder-32b-instruct}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_PAGES_PROJECT: ${CLOUDFLARE_PAGES_PROJECT:-}
      # PostgreSQL auth persistence (reaches the host Postgres from the container)
      PG_HOST: ${PG_HOST:-192.168.65.254}
      PG_PORT: ${PG_PORT:-5433}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-password}
      PG_DATABASE: ${PG_DATABASE:-chatwoot_dev}
      PG_SSLMODE: ${PG_SSLMODE:-disable}
      # Cloudflare D1 database ID — must be set in .env and match
      # wrangler.v2.jsonc d1_databases[0].database_id. No default on purpose:
      # a wrong id silently points the control plane at another database.
      D1_DATABASE_ID: ${D1_DATABASE_ID:-}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  redis-data: